<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Complete | Ritmo Latino Fest</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;700&display=swap"
        rel="stylesheet">

    <meta name="description"
        content="Join the Ritmo Latino Fest in Viña del Mar, Chile. A vibrant celebration of Latin rhythm, culture, and community.">
    <meta name="author" content="Adelso Tzep">
    <link rel="icon" href="images/favicon.ico">

    <meta property="og:title" content="Ritmo Latino Fest | Home">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adelosolorenzohmi-cloud.github.io/wdd231/final-project/index.html">
    <meta property="og:image"
        content="https://adelosolorenzohmi-cloud.github.io/wdd231/final-project/ritmo-latino-fest.webp">
    <meta property="og:description"
        content="Experience the heartbeat of Latin culture. Get the latest weather and event updates.">

    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/larger.css" media="(min-width: 768px)">

</head>

<body>
    <header>
        <h1>Ritmo Latino Fest</h1>
    </header>

    <main>
        <section class="thank-you-container">
            <h2>¡Thanks for joining.!</h2>
            <p>Your registration for the 2026 festival updates was successful.</p>

            <div class="user-data">
                <p>Welcome to the community, <strong id="user-name">Friend</strong>!</p>
                <p>We've sent a confirmation to the email address you provided.</p>
            </div>

            <br>
            <a href="index.html" class="back-home">Return to Home Page</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ritmo Latino Fest | Adelso Tzep</p>
    </footer>

    <script>
        // Simple script to pull the first name from the URL (GET method)
        const urlParams = new URLSearchParams(window.location.search);
        const firstName = urlParams.get('fname');
        if (firstName) {
            document.getElementById('user-name').textContent = firstName;
        }
    </script>
</body>

</html>
